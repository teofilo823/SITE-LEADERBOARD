<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR2 Ranked | Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-border { border-bottom: 2px solid #5865F2; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3); }
        .player-card:hover { transform: translateY(-5px); transition: all 0.3s ease; background: rgba(88, 101, 242, 0.1); cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 50; }
        .active { display: flex; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen">
        <img src="https://cdn.discordapp.com/attachments/1457080342065184873/1472581955588460627/a_c2b2f870d0949b1e0755d8f5abd8f9a4.gif?ex=69931851&is=6991c6d1&hm=877281c30df12c64ef1885c97219602fd96f42c8c6b20053335ef236b27bec4a&" 
             class="w-32 h-32 rounded-full mb-6 neon-border" alt="Server Logo">
        <h1 class="text-3xl font-bold mb-8">AR2 RANKED SYSTEM</h1>
        <button onclick="loginDiscord()" class="bg-[#5865F2] hover:bg-[#4752c4] text-white px-8 py-3 rounded-lg font-bold flex items-center gap-3 transition-all">
            <i class="fab fa-discord text-xl"></i> ENTRAR COM DISCORD
        </button>
    </div>

    <div id="dashboard" class="hidden max-w-5xl mx-auto">
        <header class="flex items-center justify-between mb-12 glass p-6 rounded-2xl">
            <div class="flex items-center gap-4">
                <img src="https://cdn.discordapp.com/attachments/1457080342065184873/1472581955588460627/a_c2b2f870d0949b1e0755d8f5abd8f9a4.gif?ex=69931851&is=6991c6d1&hm=877281c30df12c64ef1885c97219602fd96f42c8c6b20053335ef236b27bec4a&" class="w-12 h-12 rounded-full" alt="Logo">
                <h2 class="text-xl font-black tracking-widest uppercase">Leaderboard</h2>
            </div>
            <div id="user-info" class="text-sm text-gray-400"></div>
        </header>

        <div id="leaderboard-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
    </div>

    <div id="modal" class="modal p-4" onclick="closeModal(event)">
        <div class="glass max-w-md w-full p-8 rounded-3xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <div id="modal-content" class="text-center">
                </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DO DISCORD OAUTH2
        const CLIENT_ID = '1471703081313112268'; 
        const REDIRECT_URI = window.location.href.split('#')[0].split('?')[0]; 

        function loginDiscord() {
            window.location.href = `https://discord.com/oauth2/authorize?client_id=1471703081313112268&response_type=code&redirect_uri=https%3A%2F%2Far2-br.netlify.app&scope=identify`;
        }

        // Simulação de Banco de Dados (O Bot deve atualizar esse JSON)
        // No mundo real, você usaria fetch('sua_api_ou_json_url')
        let playersData = []; 

        async function init() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                // Pegar dados do usuário logado
                const userRes = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                });
                const user = await userRes.json();
                document.getElementById('user-info').innerText = `Logado como: ${user.username}`;

                loadLeaderboard();
            }
        }

        async function loadLeaderboard() {
            // AQUI VOCÊ CARREGA O SEU DATABASE.JSON
            // Exemplo fictício para o visual:
            const response = await fetch('URL_DO_SEU_DATABASE_JSON');
            const db = await response.json();
            
            playersData = Object.entries(db.users).map(([id, data]) => ({
                id,
                ...data,
                winrate: data.total > 0 ? ((data.wins / data.total) * 100).toFixed(1) : 0
            })).sort((a,b) => b.trophies - a.trophies);

            const list = document.getElementById('leaderboard-list');
            list.innerHTML = playersData.map((p, index) => `
                <div class="player-card glass p-6 rounded-2xl flex items-center gap-4 border-l-4 border-[#5865F2]" onclick="openModal('${p.id}')">
                    <span class="text-2xl font-black text-gray-600">${index + 1}</span>
                    <img src="${p.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="w-14 h-14 rounded-full border-2 border-gray-700">
                    <div>
                        <div class="font-bold text-lg">${p.username || 'Jogador'}</div>
                        <div class="text-[#5865F2] font-mono"><i class="fas fa-trophy mr-1"></i> ${p.trophies}</div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const p = playersData.find(x => x.id === id);
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <img src="${p.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-[#5865F2]">
                <h2 class="text-2xl font-bold mb-1">${p.username}</h2>
                <p class="text-gray-500 text-sm mb-6">ID: ${p.id}</p>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div class="bg-white/5 p-4 rounded-xl">
                        <div class="text-gray-400 uppercase text-xs">Troféus</div>
                        <div class="text-xl font-bold text-yellow-500">${p.trophies}</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl">
                        <div class="text-gray-400 uppercase text-xs">Winrate</div>
                        <div class="text-xl font-bold text-green-500">${p.winrate}%</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl">
                        <div class="text-gray-400 uppercase text-xs">Vitórias</div>
                        <div class="text-xl font-bold">${p.wins}</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl">
                        <div class="text-gray-400 uppercase text-xs">Derrotas</div>
                        <div class="text-xl font-bold text-red-500">${p.losses}</div>
                    </div>
                </div>
                <div class="mt-6 p-4 glass rounded-xl">
                    <div class="text-gray-400 uppercase text-xs">Total de Partidas</div>
                    <div class="text-2xl font-black">${p.total}</div>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        init();
    </script>
</body>
</html>
